name: Sandbox image bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: sandbox-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build sandbox images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OUT_DIR: dist/sandbox-images
      SOURCE_URL: https://github.com/${{ github.repository }}
      SANDBOX_ARTIFACT_BUCKET: ${{ secrets.REFUNDDESK_SANDBOX_ARTIFACT_BUCKET }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable image coordinates
        id: source
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$EXPECTED_REVISION"
          [[ "$actual_revision" =~ ^[0-9a-f]{40}$ ]]

          short_revision="${actual_revision:0:12}"
          bundle_basename="refunddesk-sandbox-${actual_revision}.images.tar.zst"
          source_basename="refunddesk-source-${actual_revision}.tar.zst"
          manifest_basename="refunddesk-sandbox-${actual_revision}.manifest.json"
          edge_operator_archive_basename="refunddesk-edge-operator-${actual_revision}.docker.tar.zst"
          edge_operator_manifest_basename="refunddesk-edge-operator-${actual_revision}.manifest.json"
          edge_operator_attestation_basename="refunddesk-edge-operator-${actual_revision}.attestation.jsonl"
          edge_operator_provenance_basename="refunddesk-edge-operator-${actual_revision}.provenance.json"

          {
            echo "REVISION=$actual_revision"
            echo "SHORT_REVISION=$short_revision"
            echo "WEB_IMAGE=refunddesk-web:sandbox-$actual_revision"
            echo "WORKER_IMAGE=refunddesk-worker:sandbox-$actual_revision"
            echo "MIGRATE_IMAGE=refunddesk-migrate:sandbox-$actual_revision"
            echo "EDGE_OPERATOR_IMAGE=refunddesk-edge-operator:sandbox-$actual_revision"
            echo "BUNDLE_BASENAME=$bundle_basename"
            echo "SOURCE_BASENAME=$source_basename"
            echo "MANIFEST_BASENAME=$manifest_basename"
            echo "EDGE_OPERATOR_DIR=$OUT_DIR/edge-operator"
            echo "EDGE_OPERATOR_ARCHIVE_BASENAME=$edge_operator_archive_basename"
            echo "EDGE_OPERATOR_MANIFEST_BASENAME=$edge_operator_manifest_basename"
            echo "EDGE_OPERATOR_ATTESTATION_BASENAME=$edge_operator_attestation_basename"
            echo "EDGE_OPERATOR_PROVENANCE_BASENAME=$edge_operator_provenance_basename"
          } >> "$GITHUB_ENV"
          {
            echo "short_revision=$short_revision"
            echo "bundle_basename=$bundle_basename"
            echo "bundle_path=$GITHUB_WORKSPACE/$OUT_DIR/$bundle_basename"
            echo "edge_operator_archive_path=$GITHUB_WORKSPACE/$OUT_DIR/edge-operator/$edge_operator_archive_basename"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the bundle workflow contract
        run: node scripts/check-sandbox-images-workflow.mjs

      - name: Verify edge watchdog systemd units
        run: |
          set -euo pipefail
          watchdog_install_path=/usr/local/libexec/refunddesk-edge-window-watchdog.sh
          test ! -e "$watchdog_install_path"
          cleanup_watchdog_install() {
            status=$?
            trap - EXIT
            sudo rm --force -- "$watchdog_install_path" || status=1
            exit "$status"
          }
          trap cleanup_watchdog_install EXIT
          sudo install --directory --mode=0755 /usr/local/libexec
          sudo install --mode=0555 \
            deploy/lightsail/scripts/refunddesk-edge-window-watchdog.sh \
            "$watchdog_install_path"
          systemd-analyze verify --recursive-errors=yes \
            deploy/lightsail/systemd/refunddesk-edge-window-watchdog.service \
            deploy/lightsail/systemd/refunddesk-edge-window-watchdog.timer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prove the edge operator build context is deny-by-default
        run: |
          set -euo pipefail
          canary_path="deploy/lightsail/refunddesk-edge-context-arbitrary-canary-${REVISION}.txt"
          probe_dockerfile="deploy/lightsail/.refunddesk-edge-context-probe.Dockerfile"
          probe_ignore="${probe_dockerfile}.dockerignore"
          probe_root="$(mktemp -d "$RUNNER_TEMP/refunddesk-edge-context-probe.XXXXXX")"
          cleanup_context_probe() {
            status=$?
            trap - EXIT
            rm --force -- "$canary_path" "$probe_dockerfile" "$probe_ignore" || status=1
            rm --force --recursive -- "$probe_root" || status=1
            exit "$status"
          }
          trap cleanup_context_probe EXIT
          test ! -e "$canary_path"
          test ! -e "$probe_dockerfile"
          test ! -e "$probe_ignore"
          printf '%s\n' 'REFUNDDESK_EDGE_CONTEXT_CANARY_DO_NOT_PACKAGE' >"$canary_path"
          cp --no-clobber -- \
            deploy/lightsail/edge-operator.Dockerfile.dockerignore \
            "$probe_ignore"

          positive_output="$probe_root/positive"
          printf '%s\n' \
            'FROM scratch' \
            'COPY deploy/lightsail/edge-operator.Dockerfile.dockerignore /allowed' \
            >"$probe_dockerfile"
          docker buildx build \
            --file "$probe_dockerfile" \
            --platform linux/amd64 \
            --output "type=local,dest=$positive_output" \
            .
          cmp --silent -- \
            deploy/lightsail/edge-operator.Dockerfile.dockerignore \
            "$positive_output/allowed"

          negative_log="$probe_root/negative.log"
          negative_output="$probe_root/negative"
          printf '%s\n' \
            'FROM scratch' \
            "COPY $canary_path /forbidden" \
            >"$probe_dockerfile"
          if docker buildx build \
            --file "$probe_dockerfile" \
            --platform linux/amd64 \
            --progress plain \
            --output "type=local,dest=$negative_output" \
            . >"$negative_log" 2>&1; then
            echo "::error::The edge-operator context admitted an arbitrary canary."
            exit 1
          fi
          grep --fixed-strings --quiet -- "$canary_path" "$negative_log"
          grep --extended-regexp --quiet -- 'not found|excluded by \.dockerignore' "$negative_log"
          test ! -e "$negative_output/forbidden"

      - name: Build linux/amd64 runtime targets
        run: |
          set -euo pipefail
          declare -A images=(
            [web]="$WEB_IMAGE"
            [worker]="$WORKER_IMAGE"
            [migrate]="$MIGRATE_IMAGE"
          )

          for target in web worker migrate; do
            docker buildx build \
              --file Dockerfile \
              --target "$target" \
              --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.source=$SOURCE_URL" \
              --tag "${images[$target]}" \
              --load \
              .
          done

      - name: Build the exact-revision edge operator image
        run: |
          set -euo pipefail
          docker buildx build \
            --file deploy/lightsail/edge-operator.Dockerfile \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --tag "$EDGE_OPERATOR_IMAGE" \
            --load \
            .

      - name: Inspect the edge operator image boundary
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$EDGE_OPERATOR_IMAGE")" = "10001:10001"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$EDGE_OPERATOR_IMAGE")" = "linux/amd64"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$EDGE_OPERATOR_IMAGE")" = "$REVISION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$EDGE_OPERATOR_IMAGE")" = "$SOURCE_URL"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$EDGE_OPERATOR_IMAGE")" = '["/usr/local/bin/refunddesk-edge-operator"]'
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$EDGE_OPERATOR_IMAGE")" = '[]'
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$EDGE_OPERATOR_IMAGE")" = '/workspace'
          docker image inspect "$EDGE_OPERATOR_IMAGE" |
            jq --exit-status '
              (.[0].Config.ExposedPorts // {} | length) == 0 and
              .[0].Config.Healthcheck == null and
              ((.[0].Config.Env // []) | all(.[];
                test("^(?:DATABASE_URL|WORKER_DATABASE_URL|PGBOSS_DATABASE_URL|DATABASE_MIGRATION_URL|STRIPE_.*(?:KEY|SECRET)|REFUNDDESK_.*(?:KEY|TOKEN)|.*PASSWORD)=") | not
              ))
            ' >/dev/null
          docker run --rm --pull never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m --cpus 0.5 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --entrypoint /usr/bin/python3 "$EDGE_OPERATOR_IMAGE" - <<'PY'
          import hashlib
          import pathlib
          import shutil

          expected = {"aws", "bash", "curl", "git", "jq", "node", "python3", "ssh"}
          for name in expected:
              path = shutil.which(name)
              if path is None or not pathlib.Path(path).is_file():
                  raise SystemExit(1)
              if len(hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()) != 64:
                  raise SystemExit(1)
          if pathlib.Path("/var/run/docker.sock").exists() or pathlib.Path("/run/docker.sock").exists():
              raise SystemExit(1)
          PY

      - name: Inspect image identity and runtime boundaries
        run: |
          set -euo pipefail
          for image in "$WEB_IMAGE" "$WORKER_IMAGE" "$MIGRATE_IMAGE"; do
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/amd64"
            test "$(
              docker image inspect \
                --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
                "$image"
            )" = "$REVISION"
            test "$(
              docker image inspect \
                --format '{{index .Config.Labels "org.opencontainers.image.source"}}' \
                "$image"
            )" = "$SOURCE_URL"
            docker image inspect "$image" |
              jq --exit-status '
                (.[0].Config.Env // []) |
                all(.[];
                  test("^(?:DATABASE_URL|WORKER_DATABASE_URL|PGBOSS_DATABASE_URL|DATABASE_MIGRATION_URL|STRIPE_.*(?:KEY|SECRET)|REFUNDDESK_.*(?:KEY|TOKEN)|.*PASSWORD)=") |
                  not
                )
              ' >/dev/null
          done
          test "$(
            docker image inspect --format '{{.Id}}' "$WEB_IMAGE"
          )" != "$(
            docker image inspect --format '{{.Id}}' "$WORKER_IMAGE"
          )"
          test "$(
            docker image inspect --format '{{.Id}}' "$WEB_IMAGE"
          )" != "$(
            docker image inspect --format '{{.Id}}' "$MIGRATE_IMAGE"
          )"
          test "$(
            docker image inspect --format '{{.Id}}' "$WORKER_IMAGE"
          )" != "$(
            docker image inspect --format '{{.Id}}' "$MIGRATE_IMAGE"
          )"

          test "$(
            docker image inspect --format '{{json .Config.Entrypoint}}' "$WEB_IMAGE"
          )" = '["/usr/bin/tini","--"]'
          test "$(
            docker image inspect --format '{{json .Config.Cmd}}' "$WEB_IMAGE"
          )" = '["node","apps/platform/server.js"]'
          test "$(
            docker image inspect --format '{{json .Config.Entrypoint}}' "$WORKER_IMAGE"
          )" = '["/usr/bin/tini","--"]'
          test "$(
            docker image inspect --format '{{json .Config.Cmd}}' "$WORKER_IMAGE"
          )" = '["node","--enable-source-maps","dist/apps/worker/src/main.js"]'
          test "$(
            docker image inspect --format '{{json .Config.Entrypoint}}' "$MIGRATE_IMAGE"
          )" = '["/usr/bin/tini","-g","--"]'
          test "$(
            docker image inspect --format '{{json .Config.Cmd}}' "$MIGRATE_IMAGE"
          )" = '["node","scripts/database-command.mjs","release-prepare"]'
          docker image inspect "$WEB_IMAGE" |
            jq --exit-status '(.[0].Config.ExposedPorts | keys) == ["3000/tcp"]' >/dev/null
          docker image inspect "$WEB_IMAGE" |
            jq --exit-status '
              .[0].Config.Healthcheck.Interval == 30000000000 and
              .[0].Config.Healthcheck.Timeout == 10000000000 and
              .[0].Config.Healthcheck.StartPeriod == 20000000000 and
              .[0].Config.Healthcheck.Retries == 3 and
              (.[0].Config.Healthcheck.Test | length) == 4 and
              .[0].Config.Healthcheck.Test[0:3] == ["CMD", "node", "-e"] and
              (.[0].Config.Healthcheck.Test[3] | contains("127.0.0.1:")) and
              (.[0].Config.Healthcheck.Test[3] | contains("/api/health")) and
              (.[0].Config.Healthcheck.Test[3] | contains("/api/ready") | not)
            ' >/dev/null
          docker image inspect "$WORKER_IMAGE" |
            jq --exit-status '(.[0].Config.ExposedPorts | keys) == ["3101/tcp"]' >/dev/null
          expected_worker_health_command="const port=process.env.WORKER_HEALTH_PORT||'3101';const host=(process.env.WORKER_HEALTH_HOST||'127.0.0.1').includes(':')?'[::1]':'127.0.0.1';fetch('http://'+host+':'+port+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          docker image inspect "$WORKER_IMAGE" |
            jq --arg expected_command "$expected_worker_health_command" --exit-status '
              .[0].Config.Healthcheck.Interval == 30000000000 and
              .[0].Config.Healthcheck.Timeout == 10000000000 and
              .[0].Config.Healthcheck.StartPeriod == 20000000000 and
              .[0].Config.Healthcheck.Retries == 3 and
              (.[0].Config.Healthcheck.Test | length) == 4 and
              .[0].Config.Healthcheck.Test == ["CMD", "node", "-e", $expected_command]
            ' >/dev/null
          docker image inspect "$MIGRATE_IMAGE" |
            jq --exit-status '(.[0].Config.ExposedPorts // {} | length) == 0' >/dev/null

          docker run --rm --pull never --entrypoint node "$WEB_IMAGE" -e "
            const fs = require('node:fs');
            const forbidden = ['/app/apps/worker', '/app/apps/migrator', '/workspace'];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
          "
          docker run --rm --pull never --entrypoint node "$WORKER_IMAGE" -e "
            const fs = require('node:fs');
            const forbidden = [
              '/app/apps/platform',
              '/app/apps/migrator',
              '/app/node_modules/.bin/prisma',
              '/app/node_modules/prisma',
              '/workspace'
            ];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
          "
          docker run --rm --pull never --entrypoint node "$MIGRATE_IMAGE" -e "
            const fs = require('node:fs');
            const forbidden = [
              '/workspace/apps/platform',
              '/workspace/apps/stripe-app',
              '/workspace/docs',
              '/workspace/docker',
              '/workspace/packages/db/test'
            ];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
          "
          test "$(
            docker run --rm --pull never --network none --entrypoint pnpm "$MIGRATE_IMAGE" --version
          )" = "11.17.0"

      - name: Exercise the constrained web liveness contract
        run: |
          set -euo pipefail
          container_name="refunddesk-web-health-${SHORT_REVISION}"
          cleanup_health_container() {
            status=$?
            trap - EXIT
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup_health_container EXIT

          docker run \
            --pull never \
            --detach \
            --name "$container_name" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 256m \
            --cpus 0.75 \
            --env NODE_OPTIONS=--max-old-space-size=192 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            "$WEB_IMAGE" >/dev/null

          health_status=starting
          for _ in {1..60}; do
            health_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$container_name"
            )"
            running="$(
              docker inspect --format '{{.State.Running}}' "$container_name"
            )"
            [[ "$running" == true ]] || break
            [[ "$health_status" == healthy ]] && break
            sleep 2
          done
          if [[ "$health_status" != healthy ]]; then
            docker inspect "$container_name" |
              jq '.[0] | {
                running: .State.Running,
                exitCode: .State.ExitCode,
                oomKilled: .State.OOMKilled,
                health: (.State.Health.Status // "missing"),
                healthLog: [
                  .State.Health.Log[]? |
                  {start: .Start, end: .End, exitCode: .ExitCode, output: .Output}
                ]
              }'
            docker logs --tail 50 "$container_name"
            exit 1
          fi
          docker inspect "$container_name" |
            jq --exit-status '
              .[0].State.Running == true and
              .[0].State.OOMKilled == false and
              .[0].State.Health.Status == "healthy"
            ' >/dev/null

          docker rm --force "$container_name" >/dev/null
          trap - EXIT

      - name: Create one checksummed image bundle
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zstd
          fi

          mkdir -p "$OUT_DIR"
          bundle_path="$OUT_DIR/$BUNDLE_BASENAME"
          source_path="$OUT_DIR/$SOURCE_BASENAME"
          manifest_path="$OUT_DIR/$MANIFEST_BASENAME"

          docker image save "$WEB_IMAGE" "$WORKER_IMAGE" "$MIGRATE_IMAGE" |
            zstd --compress --threads=0 --no-progress --stdout > "$bundle_path"
          (
            cd "$OUT_DIR"
            sha256sum "$BUNDLE_BASENAME" > "$BUNDLE_BASENAME.sha256"
          )
          bundle_sha256="$(sha256sum "$bundle_path" | cut -d ' ' -f 1)"

          if git ls-tree -r --name-only "$REVISION" deploy/lightsail |
            grep --extended-regexp '\.md$' >/dev/null; then
            echo "::error::The operator source archive contains a forbidden Markdown file."
            exit 1
          fi
          git archive --format=tar "$REVISION" deploy/lightsail |
            zstd --compress --threads=0 --no-progress --stdout > "$source_path"
          (
            cd "$OUT_DIR"
            sha256sum "$SOURCE_BASENAME" > "$SOURCE_BASENAME.sha256"
          )

          jq --null-input \
            --arg revision "$REVISION" \
            --arg source "$SOURCE_URL" \
            --arg created_at "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg bundle_file "$BUNDLE_BASENAME" \
            --arg bundle_sha256 "$bundle_sha256" \
            --arg web_reference "$WEB_IMAGE" \
            --arg web_id "$(docker image inspect --format '{{.Id}}' "$WEB_IMAGE")" \
            --arg worker_reference "$WORKER_IMAGE" \
            --arg worker_id "$(docker image inspect --format '{{.Id}}' "$WORKER_IMAGE")" \
            --arg migrate_reference "$MIGRATE_IMAGE" \
            --arg migrate_id "$(docker image inspect --format '{{.Id}}' "$MIGRATE_IMAGE")" \
            '{
              schemaVersion: 1,
              revision: $revision,
              source: $source,
              createdAt: $created_at,
              platform: "linux/amd64",
              bundle: {
                file: $bundle_file,
                sha256: $bundle_sha256
              },
              images: [
                {
                  role: "web",
                  reference: $web_reference,
                  imageId: $web_id,
                  expectedUser: "node"
                },
                {
                  role: "worker",
                  reference: $worker_reference,
                  imageId: $worker_id,
                  expectedUser: "node"
                },
                {
                  role: "migrate",
                  reference: $migrate_reference,
                  imageId: $migrate_id,
                  expectedUser: "node"
                }
              ]
            }' > "$manifest_path"

          (
            cd "$OUT_DIR"
            sha256sum --check "$BUNDLE_BASENAME.sha256"
          )
          zstd --test --no-progress "$bundle_path"
          (
            cd "$OUT_DIR"
            sha256sum --check "$SOURCE_BASENAME.sha256"
          )
          zstd --test --no-progress "$source_path"
          jq --exit-status \
            --arg revision "$REVISION" \
            --arg source "$SOURCE_URL" \
            --arg bundle_file "$BUNDLE_BASENAME" \
            --arg bundle_sha256 "$bundle_sha256" \
            '
              .schemaVersion == 1 and
              .revision == $revision and
              .source == $source and
              .platform == "linux/amd64" and
              .bundle.file == $bundle_file and
              .bundle.sha256 == $bundle_sha256 and
              ([.images[].role] == ["web", "worker", "migrate"]) and
              all(.images[]; .expectedUser == "node") and
              all(.images[]; .reference | endswith("sandbox-" + $revision)) and
              all(.images[]; .imageId | test("^sha256:[0-9a-f]{64}$"))
            ' \
            "$manifest_path" >/dev/null

          mkdir -p "$EDGE_OPERATOR_DIR"
          edge_archive_path="$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_ARCHIVE_BASENAME"
          edge_manifest_path="$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_MANIFEST_BASENAME"
          edge_tools_path="$RUNNER_TEMP/refunddesk-edge-operator-tools.json"
          docker image save "$EDGE_OPERATOR_IMAGE" |
            zstd --compress --threads=0 --no-progress --stdout > "$edge_archive_path"
          (
            cd "$EDGE_OPERATOR_DIR"
            sha256sum "$EDGE_OPERATOR_ARCHIVE_BASENAME" > "$EDGE_OPERATOR_ARCHIVE_BASENAME.sha256"
          )
          edge_archive_sha256="$(sha256sum "$edge_archive_path" | cut -d ' ' -f 1)"
          edge_archive_size="$(stat --format='%s' "$edge_archive_path")"
          edge_config_sha256="$(
            docker image inspect "$EDGE_OPERATOR_IMAGE" |
              jq --compact-output --sort-keys '.[0].Config' |
              sha256sum | cut -d ' ' -f 1
          )"

          docker run --rm --pull never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 128m --cpus 0.5 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --entrypoint /usr/bin/python3 "$EDGE_OPERATOR_IMAGE" - >"$edge_tools_path" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import subprocess

          commands = {
              "aws": ["aws", "--version"],
              "bash": ["bash", "--version"],
              "curl": ["curl", "--version"],
              "git": ["git", "--version"],
              "jq": ["jq", "--version"],
              "node": ["node", "--version"],
              "python3": ["python3", "--version"],
              "ssh": ["ssh", "-V"],
          }
          tools = {}
          for name, command in commands.items():
              path = shutil.which(name)
              if path is None:
                  raise SystemExit(1)
              version = subprocess.run(
                  command,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=10,
              ).stdout.splitlines()[0].strip()
              tools[name] = {
                  "path": path,
                  "sha256": hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest(),
                  "version": version,
              }
          print(json.dumps(tools, ensure_ascii=True, separators=(",", ":"), sort_keys=True))
          PY

          jq --compact-output --null-input --sort-keys \
            --arg archive_file "$EDGE_OPERATOR_ARCHIVE_BASENAME" \
            --arg archive_sha256 "$edge_archive_sha256" \
            --argjson archive_size "$edge_archive_size" \
            --arg config_sha256 "$edge_config_sha256" \
            --arg created_at "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg dockerfile_ignore_sha256 "$(sha256sum deploy/lightsail/edge-operator.Dockerfile.dockerignore | cut -d ' ' -f 1)" \
            --arg dockerfile_sha256 "$(sha256sum deploy/lightsail/edge-operator.Dockerfile | cut -d ' ' -f 1)" \
            --arg entrypoint_sha256 "$(sha256sum deploy/lightsail/scripts/refunddesk-edge-operator.sh | cut -d ' ' -f 1)" \
            --arg image_id "$(docker image inspect --format '{{.Id}}' "$EDGE_OPERATOR_IMAGE")" \
            --arg image_reference "$EDGE_OPERATOR_IMAGE" \
            --arg revision "$REVISION" \
            --arg source "$SOURCE_URL" \
            --slurpfile tools "$edge_tools_path" \
            '{
              archive:{file:$archive_file,sha256:$archive_sha256,sizeBytes:$archive_size},
              build:{
                dockerfileIgnoreSha256:$dockerfile_ignore_sha256,
                dockerfileSha256:$dockerfile_sha256,
                entrypointSha256:$entrypoint_sha256,
                nodeBaseDigest:"node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d",
                snapshot:"20260808T000000Z"
              },
              createdAt:$created_at,
              image:{configSha256:$config_sha256,id:$image_id,reference:$image_reference,user:"10001:10001"},
              kind:"refunddesk.edge-operator-image",
              platform:"linux/amd64",
              revision:$revision,
              schemaVersion:1,
              source:$source,
              tools:$tools[0]
            }' >"$edge_manifest_path"
          edge_manifest_sha256="$(sha256sum "$edge_manifest_path" | cut -d ' ' -f 1)"
          (
            cd "$EDGE_OPERATOR_DIR"
            sha256sum --check "$EDGE_OPERATOR_ARCHIVE_BASENAME.sha256"
          )
          zstd --test --no-progress "$edge_archive_path"
          node scripts/validate-edge-operator-image.mjs \
            --archive "$edge_archive_path" \
            --expected-archive-sha256 "$edge_archive_sha256" \
            --expected-manifest-sha256 "$edge_manifest_sha256" \
            --expected-revision "$REVISION" \
            --manifest "$edge_manifest_path" \
            --repository "$GITHUB_WORKSPACE"

      - name: Attest bundle provenance
        id: provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: dist/sandbox-images/*.tar.zst

      - name: Attest edge operator provenance
        id: edge_provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: dist/sandbox-images/edge-operator/*.tar.zst

      - name: Materialize edge operator attestation bundle
        env:
          EDGE_ATTESTATION_BUNDLE_PATH: ${{ steps.edge_provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$EDGE_ATTESTATION_BUNDLE_PATH"
          test -f "$EDGE_ATTESTATION_BUNDLE_PATH"
          test ! -L "$EDGE_ATTESTATION_BUNDLE_PATH"
          cp --no-clobber -- "$EDGE_ATTESTATION_BUNDLE_PATH" \
            "$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_ATTESTATION_BASENAME"
          test -s "$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_ATTESTATION_BASENAME"

      - name: Materialize edge operator input provenance
        env:
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          archive_path="$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_ARCHIVE_BASENAME"
          manifest_path="$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_MANIFEST_BASENAME"
          attestation_path="$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_ATTESTATION_BASENAME"
          provenance_path="$EDGE_OPERATOR_DIR/$EDGE_OPERATOR_PROVENANCE_BASENAME"
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SOURCE_REF" =~ ^refs/heads/(main|release/sandbox-edge-[0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]
          archive_sha256="$(sha256sum "$archive_path" | cut -d ' ' -f 1)"
          manifest_sha256="$(sha256sum "$manifest_path" | cut -d ' ' -f 1)"
          attestation_sha256="$(sha256sum "$attestation_path" | cut -d ' ' -f 1)"
          rekor_entry_index="$(
            jq --exit-status --slurp --raw-output '
              [.[].verificationMaterial.tlogEntries[]?.logIndex] | unique
              | select(length == 1) | .[0]
            ' "$attestation_path"
          )"
          [[ "$rekor_entry_index" =~ ^[1-9][0-9]*$ ]]
          jq --compact-output --null-input --sort-keys \
            --arg archiveSha256 "$archive_sha256" \
            --arg attestationBundleSha256 "$attestation_sha256" \
            --arg createdAt "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg manifestSha256 "$manifest_sha256" \
            --arg repository "selimhehe1/RefundDesk" \
            --arg revision "$REVISION" \
            --arg sourceRef "$EXPECTED_SOURCE_REF" \
            --arg workflowPath ".github/workflows/sandbox-images.yml" \
            --argjson rekorEntryIndex "$rekor_entry_index" \
            --argjson workflowRunAttempt "$EXPECTED_RUN_ATTEMPT" \
            --argjson workflowRunId "$EXPECTED_RUN_ID" \
            '{archiveSha256:$archiveSha256,attestationBundleSha256:$attestationBundleSha256,createdAt:$createdAt,kind:"refunddesk-edge-operator-input-provenance",manifestSha256:$manifestSha256,rekorEntryIndex:$rekorEntryIndex,repository:$repository,revision:$revision,schemaVersion:1,sourceRef:$sourceRef,verification:"github-actions-attestation-bundle-issued",workflowPath:$workflowPath,workflowRunAttempt:$workflowRunAttempt,workflowRunId:$workflowRunId}' \
            >"$provenance_path"
          test -s "$provenance_path"

      - name: Require provenance success
        if: ${{ always() && !cancelled() }}
        env:
          EDGE_PROVENANCE_OUTCOME: ${{ steps.edge_provenance.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
        run: |
          if [[ "$PROVENANCE_OUTCOME" = "success" && "$EDGE_PROVENANCE_OUTCOME" = "success" ]]; then
            echo "GitHub build provenance was attached to the runtime, operator-source and edge-operator bundles." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::GitHub build provenance is required before bundle delivery or promotion."
            echo "GitHub provenance failed; no runtime or edge-operator bundle is deliverable or promotable." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deliver verified bundle to the private sandbox bucket
        if: ${{ env.SANDBOX_ARTIFACT_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.REFUNDDESK_SANDBOX_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REFUNDDESK_SANDBOX_ARTIFACT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-3
          AWS_REGION: eu-west-3
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
        run: |
          set -euo pipefail
          command -v aws >/dev/null
          if [[ "$AWS_ACCESS_KEY_ID" != AKIA* || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::The temporary bucket credential has an unexpected shape."
            exit 1
          fi
          if [[ ! "$SANDBOX_ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::The private bucket name has an unexpected shape."
            exit 1
          fi

          artifact_prefix="refunddesk-sandbox/releases/$REVISION"
          s3_error="$RUNNER_TEMP/refunddesk-s3-error"
          s3_listing="$RUNNER_TEMP/refunddesk-s3-listing.json"
          credential_ready=false
          for _ in {1..60}; do
            if aws s3api list-objects-v2 \
              --bucket "$SANDBOX_ARTIFACT_BUCKET" \
              --prefix "$artifact_prefix/" \
              --output json \
              >"$s3_listing" \
              2>"$s3_error"; then
              credential_ready=true
              break
            fi
            if ! grep --quiet 'InvalidAccessKeyId' "$s3_error"; then
              sed 's/^/::error::/' "$s3_error"
              exit 1
            fi
            sleep 10
          done
          if [[ "$credential_ready" != true ]]; then
            sed 's/^/::error::/' "$s3_error"
            echo "::error::The temporary bucket credential did not propagate within ten minutes."
            exit 1
          fi
          rm --force "$s3_error"

          mapfile -t artifact_files < <(
            find "$OUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          expected_files=(
            "$BUNDLE_BASENAME"
            "$BUNDLE_BASENAME.sha256"
            "$MANIFEST_BASENAME"
            "$SOURCE_BASENAME"
            "$SOURCE_BASENAME.sha256"
          )
          mapfile -t expected_files < <(printf '%s\n' "${expected_files[@]}" | sort)
          if [[ "${artifact_files[*]}" != "${expected_files[*]}" ]]; then
            echo "::error::The artifact directory does not contain exactly the expected five files."
            exit 1
          fi
          declare -A runtime_remote_files=()
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            name="${key#"$artifact_prefix/"}"
            if [[ "$name" == "$key" ]] || ! printf '%s\n' "${expected_files[@]}" | grep --fixed-strings --line-regexp --quiet "$name"; then
              echo "::error::The revision-scoped runtime prefix contains an unexpected object."
              exit 1
            fi
            [[ -z "${runtime_remote_files[$name]:-}" ]] || { echo "::error::Duplicate runtime object listing."; exit 1; }
            runtime_remote_files[$name]=true
          done < <(jq -r '.Contents[]?.Key' "$s3_listing")
          rm --force "$s3_listing"

          upload_order=(
            "$BUNDLE_BASENAME"
            "$SOURCE_BASENAME"
            "$BUNDLE_BASENAME.sha256"
            "$SOURCE_BASENAME.sha256"
            "$MANIFEST_BASENAME"
          )
          for artifact_file in "${upload_order[@]}"; do
            local_size="$(stat --format='%s' "$OUT_DIR/$artifact_file")"
            local_checksum="$(openssl dgst -sha256 -binary "$OUT_DIR/$artifact_file" | base64 --wrap=0)"
            if [[ "${runtime_remote_files[$artifact_file]:-}" == true ]]; then
              existing_head="$(aws s3api head-object --bucket "$SANDBOX_ARTIFACT_BUCKET" --key "$artifact_prefix/$artifact_file" --output json)"
              jq --exit-status --argjson size "$local_size" --arg checksum "$local_checksum" '
                .ContentLength == $size and .ChecksumSHA256 == $checksum and .ServerSideEncryption == "AES256"
              ' <<<"$existing_head" >/dev/null || { echo "::error::Existing runtime object differs from the exact local bytes."; exit 1; }
              continue
            fi
            echo "Uploading verified $artifact_file"
            aws s3 cp "$OUT_DIR/$artifact_file" "s3://$SANDBOX_ARTIFACT_BUCKET/$artifact_prefix/$artifact_file" \
              --only-show-errors --no-progress --sse AES256 --checksum-algorithm SHA256
          done

          remote_listing="$(
            aws s3api list-objects-v2 \
              --bucket "$SANDBOX_ARTIFACT_BUCKET" \
              --prefix "$artifact_prefix/" \
              --output json
          )"
          remote_count="$(jq '[.Contents[]?] | length' <<<"$remote_listing")"
          if [[ "$remote_count" != "5" ]]; then
            echo "::error::The private bucket does not contain exactly five current objects."
            exit 1
          fi
          for artifact_file in "${artifact_files[@]}"; do
            local_size="$(stat --format='%s' "$OUT_DIR/$artifact_file")"
            local_checksum="$(openssl dgst -sha256 -binary "$OUT_DIR/$artifact_file" | base64 --wrap=0)"
            remote_head="$(aws s3api head-object --bucket "$SANDBOX_ARTIFACT_BUCKET" --key "$artifact_prefix/$artifact_file" --output json)"
            jq --exit-status --argjson size "$local_size" --arg checksum "$local_checksum" '
              .ContentLength == $size and .ChecksumSHA256 == $checksum and .ServerSideEncryption == "AES256"
            ' <<<"$remote_head" >/dev/null || { echo "::error::Remote runtime hash verification failed."; exit 1; }
          done

          echo "The exact five-file bundle was delivered or resumed byte-identically in the private sandbox bucket." >> "$GITHUB_STEP_SUMMARY"

          edge_prefix="refunddesk-sandbox/edge-operator/$REVISION"
          edge_listing="$(
            aws s3api list-objects-v2 \
              --bucket "$SANDBOX_ARTIFACT_BUCKET" \
              --prefix "$edge_prefix/" \
              --output json
          )"
          mapfile -t edge_artifact_files < <(
            find "$EDGE_OPERATOR_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          edge_expected_files=(
            "$EDGE_OPERATOR_ARCHIVE_BASENAME"
            "$EDGE_OPERATOR_ARCHIVE_BASENAME.sha256"
            "$EDGE_OPERATOR_ATTESTATION_BASENAME"
            "$EDGE_OPERATOR_MANIFEST_BASENAME"
            "$EDGE_OPERATOR_PROVENANCE_BASENAME"
          )
          mapfile -t edge_expected_files < <(printf '%s\n' "${edge_expected_files[@]}" | sort)
          if [[ "${edge_artifact_files[*]}" != "${edge_expected_files[*]}" ]]; then
            echo "::error::The edge-operator artifact directory does not contain exactly five files."
            exit 1
          fi
          declare -A edge_remote_files=()
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            name="${key#"$edge_prefix/"}"
            if [[ "$name" == "$key" ]] || ! printf '%s\n' "${edge_expected_files[@]}" | grep --fixed-strings --line-regexp --quiet "$name"; then
              echo "::error::The revision-scoped edge prefix contains an unexpected object."
              exit 1
            fi
            [[ -z "${edge_remote_files[$name]:-}" ]] || { echo "::error::Duplicate edge object listing."; exit 1; }
            edge_remote_files[$name]=true
          done < <(jq -r '.Contents[]?.Key' <<<"$edge_listing")
          edge_upload_order=(
            "$EDGE_OPERATOR_ARCHIVE_BASENAME"
            "$EDGE_OPERATOR_ARCHIVE_BASENAME.sha256"
            "$EDGE_OPERATOR_MANIFEST_BASENAME"
            "$EDGE_OPERATOR_ATTESTATION_BASENAME"
            "$EDGE_OPERATOR_PROVENANCE_BASENAME"
          )
          for artifact_file in "${edge_upload_order[@]}"; do
            local_size="$(stat --format='%s' "$EDGE_OPERATOR_DIR/$artifact_file")"
            local_checksum="$(openssl dgst -sha256 -binary "$EDGE_OPERATOR_DIR/$artifact_file" | base64 --wrap=0)"
            if [[ "${edge_remote_files[$artifact_file]:-}" == true ]]; then
              existing_head="$(aws s3api head-object --bucket "$SANDBOX_ARTIFACT_BUCKET" --key "$edge_prefix/$artifact_file" --output json)"
              jq --exit-status --argjson size "$local_size" --arg checksum "$local_checksum" '
                .ContentLength == $size and .ChecksumSHA256 == $checksum and .ServerSideEncryption == "AES256"
              ' <<<"$existing_head" >/dev/null || { echo "::error::Existing edge object differs from the exact local bytes."; exit 1; }
              continue
            fi
            aws s3 cp "$EDGE_OPERATOR_DIR/$artifact_file" "s3://$SANDBOX_ARTIFACT_BUCKET/$edge_prefix/$artifact_file" \
              --only-show-errors --no-progress --sse AES256 --checksum-algorithm SHA256
          done
          edge_remote_listing="$(
            aws s3api list-objects-v2 \
              --bucket "$SANDBOX_ARTIFACT_BUCKET" \
              --prefix "$edge_prefix/" \
              --output json
          )"
          if [[ "$(jq '[.Contents[]?] | length' <<<"$edge_remote_listing")" != "5" ]]; then
            echo "::error::The private bucket does not contain exactly five edge-operator objects."
            exit 1
          fi
          for artifact_file in "${edge_artifact_files[@]}"; do
            local_size="$(stat --format='%s' "$EDGE_OPERATOR_DIR/$artifact_file")"
            local_checksum="$(openssl dgst -sha256 -binary "$EDGE_OPERATOR_DIR/$artifact_file" | base64 --wrap=0)"
            remote_head="$(aws s3api head-object --bucket "$SANDBOX_ARTIFACT_BUCKET" --key "$edge_prefix/$artifact_file" --output json)"
            jq --exit-status --argjson size "$local_size" --arg checksum "$local_checksum" '
              .ContentLength == $size and .ChecksumSHA256 == $checksum and .ServerSideEncryption == "AES256"
            ' <<<"$remote_head" >/dev/null || { echo "::error::Remote edge hash verification failed."; exit 1; }
          done
          echo "The exact five-file edge-operator artifact was delivered or resumed byte-identically." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one-day sandbox bundle to GitHub
        if: ${{ env.SANDBOX_ARTIFACT_BUCKET == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refunddesk-sandbox-${{ steps.source.outputs.short_revision }}
          path: dist/sandbox-images/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

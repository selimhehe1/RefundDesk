name: Sandbox image bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: sandbox-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build sandbox images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OUT_DIR: dist/sandbox-images
      SOURCE_URL: https://github.com/${{ github.repository }}
      SANDBOX_ARTIFACT_BUCKET: ${{ secrets.REFUNDDESK_SANDBOX_ARTIFACT_BUCKET }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable image coordinates
        id: source
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$EXPECTED_REVISION"
          [[ "$actual_revision" =~ ^[0-9a-f]{40}$ ]]

          short_revision="${actual_revision:0:12}"
          bundle_basename="refunddesk-sandbox-${actual_revision}.images.tar.zst"
          source_basename="refunddesk-source-${actual_revision}.tar.zst"
          manifest_basename="refunddesk-sandbox-${actual_revision}.manifest.json"

          {
            echo "REVISION=$actual_revision"
            echo "SHORT_REVISION=$short_revision"
            echo "WEB_IMAGE=refunddesk-web:sandbox-$actual_revision"
            echo "WORKER_IMAGE=refunddesk-worker:sandbox-$actual_revision"
            echo "MIGRATE_IMAGE=refunddesk-migrate:sandbox-$actual_revision"
            echo "BUNDLE_BASENAME=$bundle_basename"
            echo "SOURCE_BASENAME=$source_basename"
            echo "MANIFEST_BASENAME=$manifest_basename"
          } >> "$GITHUB_ENV"
          {
            echo "short_revision=$short_revision"
            echo "bundle_basename=$bundle_basename"
            echo "bundle_path=$GITHUB_WORKSPACE/$OUT_DIR/$bundle_basename"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the bundle workflow contract
        run: node scripts/check-sandbox-images-workflow.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build linux/amd64 runtime targets
        run: |
          set -euo pipefail
          declare -A images=(
            [web]="$WEB_IMAGE"
            [worker]="$WORKER_IMAGE"
            [migrate]="$MIGRATE_IMAGE"
          )

          for target in web worker migrate; do
            docker buildx build \
              --file Dockerfile \
              --target "$target" \
              --platform linux/amd64 \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.source=$SOURCE_URL" \
              --tag "${images[$target]}" \
              --load \
              .
          done

      - name: Inspect image identity and runtime boundaries
        run: |
          set -euo pipefail
          for image in "$WEB_IMAGE" "$WORKER_IMAGE" "$MIGRATE_IMAGE"; do
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/amd64"
            test "$(
              docker image inspect \
                --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
                "$image"
            )" = "$REVISION"
            test "$(
              docker image inspect \
                --format '{{index .Config.Labels "org.opencontainers.image.source"}}' \
                "$image"
            )" = "$SOURCE_URL"
            docker image inspect "$image" |
              jq --exit-status '
                (.[0].Config.Env // []) |
                all(.[];
                  test("^(?:DATABASE_URL|WORKER_DATABASE_URL|PGBOSS_DATABASE_URL|DATABASE_MIGRATION_URL|STRIPE_.*(?:KEY|SECRET)|REFUNDDESK_.*(?:KEY|TOKEN)|.*PASSWORD)=") |
                  not
                )
              ' >/dev/null
          done
          test "$(
            docker image inspect --format '{{.Id}}' "$WEB_IMAGE"
          )" != "$(
            docker image inspect --format '{{.Id}}' "$WORKER_IMAGE"
          )"
          test "$(
            docker image inspect --format '{{.Id}}' "$WEB_IMAGE"
          )" != "$(
            docker image inspect --format '{{.Id}}' "$MIGRATE_IMAGE"
          )"
          test "$(
            docker image inspect --format '{{.Id}}' "$WORKER_IMAGE"
          )" != "$(
            docker image inspect --format '{{.Id}}' "$MIGRATE_IMAGE"
          )"

          test "$(
            docker image inspect --format '{{json .Config.Entrypoint}}' "$WEB_IMAGE"
          )" = '["/usr/bin/tini","--"]'
          test "$(
            docker image inspect --format '{{json .Config.Cmd}}' "$WEB_IMAGE"
          )" = '["node","apps/platform/server.js"]'
          test "$(
            docker image inspect --format '{{json .Config.Entrypoint}}' "$WORKER_IMAGE"
          )" = '["/usr/bin/tini","--"]'
          test "$(
            docker image inspect --format '{{json .Config.Cmd}}' "$WORKER_IMAGE"
          )" = '["node","--enable-source-maps","dist/apps/worker/src/main.js"]'
          test "$(
            docker image inspect --format '{{json .Config.Entrypoint}}' "$MIGRATE_IMAGE"
          )" = '["/usr/bin/tini","-g","--"]'
          test "$(
            docker image inspect --format '{{json .Config.Cmd}}' "$MIGRATE_IMAGE"
          )" = '["node","scripts/database-command.mjs","release-prepare"]'
          docker image inspect "$WEB_IMAGE" |
            jq --exit-status '(.[0].Config.ExposedPorts | keys) == ["3000/tcp"]' >/dev/null
          docker image inspect "$WORKER_IMAGE" |
            jq --exit-status '(.[0].Config.ExposedPorts | keys) == ["3101/tcp"]' >/dev/null
          docker image inspect "$MIGRATE_IMAGE" |
            jq --exit-status '(.[0].Config.ExposedPorts // {} | length) == 0' >/dev/null

          docker run --rm --entrypoint node "$WEB_IMAGE" -e "
            const fs = require('node:fs');
            const forbidden = ['/app/apps/worker', '/app/apps/migrator', '/workspace'];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
          "
          docker run --rm --entrypoint node "$WORKER_IMAGE" -e "
            const fs = require('node:fs');
            const forbidden = [
              '/app/apps/platform',
              '/app/apps/migrator',
              '/app/node_modules/.bin/prisma',
              '/app/node_modules/prisma',
              '/workspace'
            ];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
          "
          docker run --rm --entrypoint node "$MIGRATE_IMAGE" -e "
            const fs = require('node:fs');
            const forbidden = [
              '/workspace/apps/platform',
              '/workspace/apps/stripe-app',
              '/workspace/docs',
              '/workspace/docker',
              '/workspace/packages/db/test'
            ];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
          "
          test "$(
            docker run --rm --network none --entrypoint pnpm "$MIGRATE_IMAGE" --version
          )" = "11.17.0"

      - name: Create one checksummed image bundle
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zstd
          fi

          mkdir -p "$OUT_DIR"
          bundle_path="$OUT_DIR/$BUNDLE_BASENAME"
          source_path="$OUT_DIR/$SOURCE_BASENAME"
          manifest_path="$OUT_DIR/$MANIFEST_BASENAME"

          docker image save "$WEB_IMAGE" "$WORKER_IMAGE" "$MIGRATE_IMAGE" |
            zstd --compress --threads=0 --no-progress --stdout > "$bundle_path"
          (
            cd "$OUT_DIR"
            sha256sum "$BUNDLE_BASENAME" > "$BUNDLE_BASENAME.sha256"
          )
          bundle_sha256="$(sha256sum "$bundle_path" | cut -d ' ' -f 1)"

          if git ls-tree --recursive --name-only "$REVISION" deploy/lightsail |
            grep --extended-regexp '\.md$' >/dev/null; then
            echo "::error::The operator source archive contains a forbidden Markdown file."
            exit 1
          fi
          git archive --format=tar "$REVISION" deploy/lightsail |
            zstd --compress --threads=0 --no-progress --stdout > "$source_path"
          (
            cd "$OUT_DIR"
            sha256sum "$SOURCE_BASENAME" > "$SOURCE_BASENAME.sha256"
          )

          jq --null-input \
            --arg revision "$REVISION" \
            --arg source "$SOURCE_URL" \
            --arg created_at "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg bundle_file "$BUNDLE_BASENAME" \
            --arg bundle_sha256 "$bundle_sha256" \
            --arg web_reference "$WEB_IMAGE" \
            --arg web_id "$(docker image inspect --format '{{.Id}}' "$WEB_IMAGE")" \
            --arg worker_reference "$WORKER_IMAGE" \
            --arg worker_id "$(docker image inspect --format '{{.Id}}' "$WORKER_IMAGE")" \
            --arg migrate_reference "$MIGRATE_IMAGE" \
            --arg migrate_id "$(docker image inspect --format '{{.Id}}' "$MIGRATE_IMAGE")" \
            '{
              schemaVersion: 1,
              revision: $revision,
              source: $source,
              createdAt: $created_at,
              platform: "linux/amd64",
              bundle: {
                file: $bundle_file,
                sha256: $bundle_sha256
              },
              images: [
                {
                  role: "web",
                  reference: $web_reference,
                  imageId: $web_id,
                  expectedUser: "node"
                },
                {
                  role: "worker",
                  reference: $worker_reference,
                  imageId: $worker_id,
                  expectedUser: "node"
                },
                {
                  role: "migrate",
                  reference: $migrate_reference,
                  imageId: $migrate_id,
                  expectedUser: "node"
                }
              ]
            }' > "$manifest_path"

          (
            cd "$OUT_DIR"
            sha256sum --check "$BUNDLE_BASENAME.sha256"
          )
          zstd --test --no-progress "$bundle_path"
          (
            cd "$OUT_DIR"
            sha256sum --check "$SOURCE_BASENAME.sha256"
          )
          zstd --test --no-progress "$source_path"
          jq --exit-status \
            --arg revision "$REVISION" \
            --arg source "$SOURCE_URL" \
            --arg bundle_file "$BUNDLE_BASENAME" \
            --arg bundle_sha256 "$bundle_sha256" \
            '
              .schemaVersion == 1 and
              .revision == $revision and
              .source == $source and
              .platform == "linux/amd64" and
              .bundle.file == $bundle_file and
              .bundle.sha256 == $bundle_sha256 and
              ([.images[].role] == ["web", "worker", "migrate"]) and
              all(.images[]; .expectedUser == "node") and
              all(.images[]; .reference | endswith("sandbox-" + $revision)) and
              all(.images[]; .imageId | test("^sha256:[0-9a-f]{64}$"))
            ' \
            "$manifest_path" >/dev/null

      - name: Attest bundle provenance when supported
        id: provenance
        continue-on-error: true
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: dist/sandbox-images/*.tar.zst

      - name: Report provenance outcome
        if: ${{ always() && !cancelled() }}
        env:
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
        run: |
          if [[ "$PROVENANCE_OUTCOME" = "success" ]]; then
            echo "GitHub build provenance was attached to the image and operator-source bundles." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub artifact attestations are unavailable for this repository or plan; the SHA-256 bundle remains available."
            echo "GitHub provenance was unavailable; verify the adjacent SHA-256 file before loading." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deliver verified bundle to the private sandbox bucket
        if: ${{ env.SANDBOX_ARTIFACT_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.REFUNDDESK_SANDBOX_ARTIFACT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REFUNDDESK_SANDBOX_ARTIFACT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-3
          AWS_REGION: eu-west-3
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
        run: |
          set -euo pipefail
          command -v aws >/dev/null
          [[ "$AWS_ACCESS_KEY_ID" == AKIA* ]]
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]]
          [[ "$SANDBOX_ARTIFACT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]

          artifact_prefix="refunddesk-sandbox/releases/$REVISION"
          committed=false
          cleanup_partial_upload() {
            status=$?
            trap - EXIT
            if (( status != 0 )) && [[ "$committed" != true ]]; then
              aws s3 rm \
                "s3://$SANDBOX_ARTIFACT_BUCKET/$artifact_prefix/" \
                --recursive \
                --only-show-errors || status=1
            fi
            exit "$status"
          }
          trap cleanup_partial_upload EXIT

          existing_count="$(
            aws s3api list-objects-v2 \
              --bucket "$SANDBOX_ARTIFACT_BUCKET" \
              --prefix "$artifact_prefix/" \
              --query 'KeyCount' \
              --output text
          )"
          [[ "$existing_count" == "0" ]]

          mapfile -t artifact_files < <(
            find "$OUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          expected_files=(
            "$BUNDLE_BASENAME"
            "$BUNDLE_BASENAME.sha256"
            "$MANIFEST_BASENAME"
            "$SOURCE_BASENAME"
            "$SOURCE_BASENAME.sha256"
          )
          mapfile -t expected_files < <(printf '%s\n' "${expected_files[@]}" | sort)
          [[ "${artifact_files[*]}" == "${expected_files[*]}" ]]

          aws s3 cp \
            "$OUT_DIR/" \
            "s3://$SANDBOX_ARTIFACT_BUCKET/$artifact_prefix/" \
            --recursive \
            --only-show-errors \
            --no-progress \
            --sse AES256

          remote_count="$(
            aws s3api list-objects-v2 \
              --bucket "$SANDBOX_ARTIFACT_BUCKET" \
              --prefix "$artifact_prefix/" \
              --query 'KeyCount' \
              --output text
          )"
          [[ "$remote_count" == "5" ]]
          for artifact_file in "${artifact_files[@]}"; do
            local_size="$(stat --format='%s' "$OUT_DIR/$artifact_file")"
            remote_size="$(
              aws s3api head-object \
                --bucket "$SANDBOX_ARTIFACT_BUCKET" \
                --key "$artifact_prefix/$artifact_file" \
                --query 'ContentLength' \
                --output text
            )"
            [[ "$local_size" == "$remote_size" ]]
          done

          committed=true
          echo "The exact five-file bundle was delivered to the private sandbox bucket and size-verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one-day sandbox bundle to GitHub
        if: ${{ env.SANDBOX_ARTIFACT_BUCKET == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refunddesk-sandbox-${{ steps.source.outputs.short_revision }}
          path: dist/sandbox-images/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: refunddesk
          POSTGRES_USER: refunddesk_owner
          POSTGRES_PASSWORD: refunddesk_owner_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refunddesk_owner -d refunddesk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://refunddesk_web_login:refunddesk_web_local@localhost:5432/refunddesk
      WORKER_DATABASE_URL: postgresql://refunddesk_worker_login:refunddesk_worker_local@localhost:5432/refunddesk
      DATABASE_MIGRATION_URL: postgresql://refunddesk_owner:refunddesk_owner_local@localhost:5432/refunddesk
      PGBOSS_DATABASE_URL: postgresql://refunddesk_queue_login:refunddesk_queue_local@localhost:5432/refunddesk
      REFUNDDESK_TEST_DATABASE_URL: postgresql://refunddesk_owner:refunddesk_owner_local@localhost:5432/refunddesk
      REFUNDDESK_FIELD_ENCRYPTION_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      REFUNDDESK_PROOF_HMAC_KEY_V1: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      REFUNDDESK_EXPORT_SIGNING_KEY_V1: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      REFUNDDESK_ACTIVE_FIELD_KEY_VERSION: v1
      REFUNDDESK_ACTIVE_PROOF_KEY_VERSION: v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:local:roles
      - run: pnpm db:generate
      - run: pnpm test:integration
      - run: pnpm verify
      - run: pnpm audit:prod
      - name: Validate Lightsail operator contracts
        run: |
          set -euo pipefail
          shellcheck --severity=warning --source-path=SCRIPTDIR deploy/lightsail/scripts/*.sh

          sudo install -d -o root -g root -m 0700 /etc/refunddesk
          for name in postgres platform worker migration caddy backup; do
            sudo install -o root -g root -m 0600 \
              "deploy/lightsail/${name}.env.example" \
              "/etc/refunddesk/${name}.env"
          done
          printf '%s\n' \
            'REFUNDDESK_IMAGE_TAG=sandbox-ci' \
            'REFUNDDESK_REVISION=0000000000000000000000000000000000000000' |
            sudo tee /etc/refunddesk/release.env >/dev/null
          sudo chmod 0600 /etc/refunddesk/release.env

          sudo docker compose \
            --project-name refunddesk-ci \
            --env-file /etc/refunddesk/release.env \
            --file deploy/lightsail/compose.yml \
            config --quiet

          sudo install -d -o root -g root -m 0700 \
            /etc/refunddesk/secrets \
            /var/lib/refunddesk/postgres/data
          sudo install -d -o root -g 999 -m 0750 /etc/refunddesk/tls/postgres
          sudo install -d -o root -g 1000 -m 0750 /etc/refunddesk/tls/verifier
          sudo install -d -o root -g root -m 0755 /etc/refunddesk/tls/client

          for name in owner web worker queue; do
            secret_file="$(mktemp)"
            openssl rand -hex 32 > "$secret_file"
            sudo install -o root -g root -m 0600 \
              "$secret_file" \
              "/etc/refunddesk/secrets/postgres-${name}-password"
            rm -f -- "$secret_file"
          done

          sudo env \
            REFUNDDESK_TLS_ROOT=/etc/refunddesk/tls \
            bash deploy/lightsail/scripts/provision-internal-pki.sh

          for caddyfile in public verifier; do
            caddy_arguments=(
              --rm
              --network none
              --user 1000:1000
              --read-only
              --cap-drop ALL
              --cap-add NET_BIND_SERVICE
              --security-opt no-new-privileges
              --tmpfs /data:uid=1000,gid=1000,mode=0700
              --tmpfs /config:uid=1000,gid=1000,mode=0700
              --tmpfs /tmp:uid=1000,gid=1000,mode=1777
              --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/lightsail/Caddyfile.${caddyfile},target=/etc/caddy/Caddyfile,readonly"
            )
            if [[ "$caddyfile" = "public" ]]; then
              caddy_arguments+=(
                --env REFUNDDESK_PUBLIC_HOST=sandbox.example.invalid
                --env REFUNDDESK_ACME_EMAIL=operator@example.invalid
              )
            else
              caddy_arguments+=(
                --mount type=bind,source=/etc/refunddesk/tls/verifier,target=/run/refunddesk/tls,readonly
              )
            fi
            sudo docker run "${caddy_arguments[@]}" \
              caddy:2.11.4-alpine \
              caddy validate --config /etc/caddy/Caddyfile
          done
          systemd-analyze verify \
            deploy/lightsail/systemd/refunddesk-backup.service \
            deploy/lightsail/systemd/refunddesk-backup.timer

          cleanup_lightsail_contract() {
            local status="$1"
            if [[ "$status" -ne 0 ]]; then
              sudo docker compose \
                --project-name refunddesk-ci \
                --env-file /etc/refunddesk/release.env \
                --file deploy/lightsail/compose.yml \
                logs --no-color postgres || true
            fi
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              down --remove-orphans >/dev/null 2>&1 || true
            exit "$status"
          }
          trap 'cleanup_lightsail_contract "$?"' EXIT

          for bootstrap_pass in 1 2; do
            echo "PostgreSQL restricted-login bootstrap pass ${bootstrap_pass}/2"
            sudo env \
              PATH="$PATH" \
              REFUNDDESK_ROOT="$GITHUB_WORKSPACE" \
              REFUNDDESK_CONFIG_ROOT=/etc/refunddesk \
              REFUNDDESK_COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/lightsail/compose.yml" \
              REFUNDDESK_COMPOSE_PROJECT=refunddesk-ci \
              REFUNDDESK_RELEASE_ENV=/etc/refunddesk/release.env \
              REFUNDDESK_OPERATOR_LOCK=/run/lock/refunddesk-ci.lock \
              REFUNDDESK_IMAGE_TAG=sandbox-ci \
              bash deploy/lightsail/scripts/bootstrap-database.sh
          done

          role_count="$(
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              exec --no-TTY postgres \
              psql --username=refunddesk_owner --dbname=refunddesk \
                --tuples-only --no-align \
                --command="SELECT count(*) FROM pg_roles WHERE rolname IN ('refunddesk_web_login','refunddesk_worker_login','refunddesk_queue_login') AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls;"
          )"
          test "$role_count" = "3"
          trap - EXIT
          cleanup_lightsail_contract 0
      - name: Build provider-neutral OCI targets
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --target web --tag refunddesk-web:ci .
          docker build --target worker --tag refunddesk-worker:ci .
          docker build --target migrate --tag refunddesk-migrate:ci .
      - name: Inspect OCI security contracts
        run: |
          set -euo pipefail
          for image in refunddesk-web:ci refunddesk-worker:ci refunddesk-migrate:ci; do
            test "$(docker inspect --format '{{.Config.User}}' "$image")" = "node"
          done
          docker run --rm --entrypoint node refunddesk-migrate:ci -e "
            const fs = require('node:fs');
            const forbidden = [
              '/workspace/apps/platform',
              '/workspace/apps/stripe-app',
              '/workspace/docs',
              '/workspace/docker',
              '/workspace/packages/db/test'
            ];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
            if (!fs.existsSync('/workspace/packages/config/dist/check-release.js')) process.exit(1);
          "
          docker run --rm --entrypoint node refunddesk-worker:ci -e "
            const fs = require('node:fs');
            if (
              fs.existsSync('/app/node_modules/.bin/prisma') ||
              fs.existsSync('/app/node_modules/prisma')
            ) process.exit(1);
          "
          test "$(
            docker run --rm --network none --entrypoint pnpm \
              refunddesk-migrate:ci --version
          )" = "11.17.0"
      - name: Smoke scoped OCI runtimes
        env:
          APP_BASE_URL: https://sandbox.refunddesk.invalid
          REFUNDDESK_GLOBAL_LIVE_ENABLED: "false"
          STRIPE_API_VERSION: 2026-06-24.dahlia
          STRIPE_APP_ID: ca_ciSynthetic
          STRIPE_APP_SIGNING_SECRET: absec_ci_synthetic
          STRIPE_PLATFORM_TEST_READ_KEY: rk_test_ci_platform_read
          STRIPE_MANAGED_SANDBOX_READ_KEY: rk_test_ci_sandbox_read
          STRIPE_PLATFORM_TEST_EFFECT_KEY: rk_test_ci_platform_effect
          STRIPE_MANAGED_SANDBOX_EFFECT_KEY: rk_test_ci_sandbox_effect
          STRIPE_CONNECTED_TEST_WEBHOOK_SECRET: whsec_ci_test
          STRIPE_CONNECTED_SANDBOX_WEBHOOK_SECRET: whsec_ci_sandbox
          STRIPE_CONNECTED_LIVE_WEBHOOK_SECRET: disabled
          REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V1: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
          REFUNDDESK_ACTIVE_APPROVAL_ATTESTATION_KEY_VERSION: v1
          REFUNDDESK_SIGNED_REQUEST_VERIFIER_TOKEN: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
          REFUNDDESK_SIGNED_REQUEST_VERIFIER_URL: https://worker.refunddesk.invalid/internal/v1/signed-requests/verify
        run: |
          set -euo pipefail
          cleanup() {
            docker stop --time 40 refunddesk-worker-ci refunddesk-web-ci >/dev/null 2>&1 || true
            docker rm refunddesk-worker-ci refunddesk-web-ci >/dev/null 2>&1 || true
          }
          finish() {
            exit_code="$?"
            trap - EXIT
            if [[ "$exit_code" -ne 0 ]]; then
              for container in refunddesk-web-ci refunddesk-worker-ci; do
                if docker inspect "$container" >/dev/null 2>&1; then
                  docker inspect \
                    --format 'container={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{json .State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    "$container" || true
                  docker logs --tail 200 "$container" 2>&1 || true
                fi
              done
            fi
            cleanup
            exit "$exit_code"
          }
          trap finish EXIT

          docker run --rm --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            -e DATABASE_URL \
            -e WORKER_DATABASE_URL \
            -e DATABASE_MIGRATION_URL \
            -e PGBOSS_DATABASE_URL \
            refunddesk-migrate:ci

          docker run -d --network host --name refunddesk-web-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 10 \
            -e NODE_ENV=production \
            -e LOG_LEVEL=error \
            -e PORT=3200 \
            -e APP_BASE_URL \
            -e DATABASE_URL \
            -e STRIPE_API_VERSION \
            -e STRIPE_APP_ID \
            -e STRIPE_PLATFORM_TEST_READ_KEY \
            -e STRIPE_MANAGED_SANDBOX_READ_KEY \
            -e STRIPE_CONNECTED_TEST_WEBHOOK_SECRET \
            -e STRIPE_CONNECTED_SANDBOX_WEBHOOK_SECRET \
            -e STRIPE_CONNECTED_LIVE_WEBHOOK_SECRET \
            -e REFUNDDESK_GLOBAL_LIVE_ENABLED \
            -e REFUNDDESK_FIELD_ENCRYPTION_KEY_V1 \
            -e REFUNDDESK_EXPORT_SIGNING_KEY_V1 \
            -e REFUNDDESK_ACTIVE_FIELD_KEY_VERSION \
            -e REFUNDDESK_SIGNED_REQUEST_VERIFIER_TOKEN \
            -e REFUNDDESK_SIGNED_REQUEST_VERIFIER_URL \
            refunddesk-web:ci

          docker run -d --network host --name refunddesk-worker-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 10 \
            -e NODE_ENV=production \
            -e LOG_LEVEL=error \
            -e WORKER_DATABASE_URL \
            -e PGBOSS_DATABASE_URL \
            -e STRIPE_API_VERSION \
            -e STRIPE_APP_SIGNING_SECRET \
            -e STRIPE_PLATFORM_TEST_EFFECT_KEY \
            -e STRIPE_MANAGED_SANDBOX_EFFECT_KEY \
            -e REFUNDDESK_GLOBAL_LIVE_ENABLED \
            -e REFUNDDESK_PROOF_HMAC_KEY_V1 \
            -e REFUNDDESK_ACTIVE_PROOF_KEY_VERSION \
            -e REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V1 \
            -e REFUNDDESK_ACTIVE_APPROVAL_ATTESTATION_KEY_VERSION \
            -e REFUNDDESK_SIGNED_REQUEST_VERIFIER_TOKEN \
            -e WORKER_HEALTH_HOST=0.0.0.0 \
            -e WORKER_HEALTH_PORT=3201 \
            refunddesk-worker:ci

          wait_for_endpoint() {
            name="$1"
            container="$2"
            url="$3"
            for attempt in $(seq 1 80); do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [[ "$status" = "200" ]]; then
                return 0
              fi
              if [[ "$attempt" -eq 80 ]]; then
                echo "endpoint=${name} host_status=${status}"
                docker exec "$container" node -e "
                  fetch('${url}')
                    .then((response) => console.error('endpoint=${name} container_status=' + response.status))
                    .catch(() => console.error('endpoint=${name} container_status=unreachable'));
                " || true
                return 1
              fi
              sleep 0.25
            done
          }
          wait_for_endpoint web-ready refunddesk-web-ci http://127.0.0.1:3200/api/ready
          wait_for_endpoint worker-ready refunddesk-worker-ci http://127.0.0.1:3201/ready
          docker exec refunddesk-web-ci node -e "
            const forbidden = [
              'STRIPE_APP_SIGNING_SECRET',
              'STRIPE_PLATFORM_TEST_EFFECT_KEY',
              'STRIPE_MANAGED_SANDBOX_EFFECT_KEY',
              'REFUNDDESK_PROOF_HMAC_KEY_V1',
              'REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V1',
              'WORKER_DATABASE_URL',
              'PGBOSS_DATABASE_URL',
              'DATABASE_MIGRATION_URL'
            ];
            if (forbidden.some((name) => process.env[name] !== undefined)) process.exit(1);
          "
          docker exec refunddesk-worker-ci node -e "
            const forbidden = [
              'STRIPE_PLATFORM_TEST_READ_KEY',
              'STRIPE_MANAGED_SANDBOX_READ_KEY',
              'STRIPE_CONNECTED_TEST_WEBHOOK_SECRET',
              'STRIPE_CONNECTED_SANDBOX_WEBHOOK_SECRET',
              'REFUNDDESK_FIELD_ENCRYPTION_KEY_V1',
              'REFUNDDESK_EXPORT_SIGNING_KEY_V1',
              'DATABASE_URL',
              'DATABASE_MIGRATION_URL'
            ];
            if (forbidden.some((name) => process.env[name] !== undefined)) process.exit(1);
          "
          curl --fail --silent http://127.0.0.1:3200/ >/dev/null
          test "$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3200/api/v1/context/sync
          )" = "401"
          test "$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3201/internal/v1/signed-requests/verify
          )" = "401"

          for container in refunddesk-web-ci refunddesk-worker-ci; do
            for attempt in $(seq 1 40); do
              test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy" && break
              test "$attempt" -lt 40
              sleep 0.25
            done
          done

          started_at="$(date +%s)"
          docker stop --time 40 refunddesk-worker-ci >/dev/null
          stopped_at="$(date +%s)"
          test "$((stopped_at - started_at))" -lt 40
          test "$(docker inspect --format '{{.State.ExitCode}}' refunddesk-worker-ci)" = "0"
          docker stop --time 40 refunddesk-web-ci >/dev/null
      - name: Verify standalone Stripe App package
        working-directory: apps/stripe-app
        run: |
          corepack pnpm@10.30.3 install --frozen-lockfile --ignore-workspace --ignore-scripts
          corepack pnpm@10.30.3 --ignore-workspace run lint
          corepack pnpm@10.30.3 --ignore-workspace run build
          corepack pnpm@10.30.3 --ignore-workspace run test
          corepack pnpm@10.30.3 --ignore-workspace audit --prod --audit-level high

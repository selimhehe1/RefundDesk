name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: refunddesk
          POSTGRES_USER: refunddesk_owner
          POSTGRES_PASSWORD: refunddesk_owner_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refunddesk_owner -d refunddesk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://refunddesk_web_login:refunddesk_web_local@localhost:5432/refunddesk
      WORKER_DATABASE_URL: postgresql://refunddesk_worker_login:refunddesk_worker_local@localhost:5432/refunddesk
      DATABASE_MIGRATION_URL: postgresql://refunddesk_owner:refunddesk_owner_local@localhost:5432/refunddesk
      PGBOSS_DATABASE_URL: postgresql://refunddesk_queue_login:refunddesk_queue_local@localhost:5432/refunddesk
      REFUNDDESK_TEST_DATABASE_URL: postgresql://refunddesk_owner:refunddesk_owner_local@localhost:5432/refunddesk
      REFUNDDESK_FIELD_ENCRYPTION_KEY_V1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      REFUNDDESK_PROOF_HMAC_KEY_V1: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      REFUNDDESK_EXPORT_SIGNING_KEY_V1: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      REFUNDDESK_ACTIVE_FIELD_KEY_VERSION: v1
      REFUNDDESK_FIELD_KEY_ROTATION_STATE: legacy
      REFUNDDESK_ACTIVE_PROOF_KEY_VERSION: v1
      REFUNDDESK_PROOF_KEY_ROTATION_STATE: legacy
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the exact event revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$actual_revision" = "$EXPECTED_REVISION"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:local:roles
      - run: pnpm db:generate
      - run: pnpm test:integration
      - run: pnpm verify
      - run: pnpm audit:prod
      - name: Validate Lightsail operator contracts
        run: |
          set -euo pipefail
          shellcheck --severity=warning --source-path=SCRIPTDIR deploy/lightsail/scripts/*.sh

          # shellcheck parses with its own grammar and accepts constructs bash
          # rejects: a newline after a binary operator inside [[ ]] ends the
          # conditional expression in bash but not in shellcheck. Such a script
          # lints clean and is still unparseable, so it fails at the first line
          # of the run rather than at review. Parse with bash itself as well.
          for operator_script in deploy/lightsail/scripts/*.sh; do
            bash -n "$operator_script"
          done

          sudo install -d -o root -g root -m 0700 /etc/refunddesk
          for name in postgres platform worker migration maintenance caddy backup; do
            sudo install -o root -g root -m 0600 \
              "deploy/lightsail/${name}.env.example" \
              "/etc/refunddesk/${name}.env"
          done
          printf '%s\n' \
            'REFUNDDESK_IMAGE_TAG=sandbox-ci' \
            'REFUNDDESK_REVISION=0000000000000000000000000000000000000000' |
            sudo tee /etc/refunddesk/release.env >/dev/null
          sudo chmod 0600 /etc/refunddesk/release.env

          sudo docker compose \
            --project-name refunddesk-ci \
            --env-file /etc/refunddesk/release.env \
            --file deploy/lightsail/compose.yml \
            config --quiet

          sudo install -d -o root -g root -m 0700 \
            /etc/refunddesk/secrets \
            /var/lib/refunddesk/postgres/data
          sudo install -d -o root -g 999 -m 0750 /etc/refunddesk/tls/postgres
          sudo install -d -o root -g 1000 -m 0750 /etc/refunddesk/tls/verifier
          sudo install -d -o root -g root -m 0755 /etc/refunddesk/tls/client

          for name in owner web worker queue maintenance; do
            secret_file="$(mktemp)"
            openssl rand -hex 32 > "$secret_file"
            sudo install -o root -g root -m 0600 \
              "$secret_file" \
              "/etc/refunddesk/secrets/postgres-${name}-password"
            rm -f -- "$secret_file"
          done

          unsafe_private_orphan=/run/refunddesk-internal-pki.BAD001
          sudo install -d -o root -g root -m 0700 "$unsafe_private_orphan"
          sudo install -o root -g root -m 0600 /dev/null "$unsafe_private_orphan/foreign"
          if sudo env \
            REFUNDDESK_TLS_ROOT=/etc/refunddesk/tls \
            bash deploy/lightsail/scripts/provision-internal-pki.sh; then
            echo "unsafe private PKI orphan was accepted" >&2
            exit 1
          fi
          sudo test -f "$unsafe_private_orphan/foreign"
          sudo rm -- "$unsafe_private_orphan/foreign"
          sudo rmdir -- "$unsafe_private_orphan"

          safe_private_orphan=/run/refunddesk-internal-pki.CI0001
          safe_stage_orphan=/etc/refunddesk/tls/.pki-stage.CI0001
          sudo install -d -o root -g root -m 0700 "$safe_private_orphan"
          sudo install -o root -g root -m 0600 \
            /dev/null \
            "$safe_private_orphan/postgres-ca.key"
          sudo install -o root -g root -m 0600 \
            /dev/null \
            "$safe_private_orphan/postgres-ca.crt"
          sudo install -o root -g root -m 0600 \
            /dev/null \
            "$safe_private_orphan/client-ca-bundle.crt"
          sudo install -d -o root -g root -m 0700 \
            "$safe_stage_orphan" \
            "$safe_stage_orphan/postgres" \
            "$safe_stage_orphan/verifier"
          sudo install -o root -g root -m 0600 \
            /dev/null \
            "$safe_stage_orphan/postgres/ca.crt"
          sudo rmdir -- /etc/refunddesk/tls/client
          sudo install -d -o root -g root -m 0755 /etc/refunddesk/tls/client
          sudo install -o root -g root -m 0444 \
            "$safe_private_orphan/client-ca-bundle.crt" \
            /etc/refunddesk/tls/client/refunddesk-ca-bundle.crt

          sudo env \
            REFUNDDESK_TLS_ROOT=/etc/refunddesk/tls \
            bash deploy/lightsail/scripts/provision-internal-pki.sh
          sudo test ! -e "$safe_private_orphan"
          sudo test ! -e "$safe_stage_orphan"
          mapfile -d '' pki_markers < <(
            sudo find /etc/refunddesk/tls \
              -xdev \
              -mindepth 1 \
              -maxdepth 1 \
              -name '.pki-generation.*.sha256' \
              -print0
          )
          test "${#pki_markers[@]}" -eq 1
          pki_marker_name="${pki_markers[0]##*/}"
          pki_generation_suffix="${pki_marker_name#.pki-generation.}"
          pki_generation_suffix="${pki_generation_suffix%.sha256}"
          [[ "$pki_generation_suffix" =~ ^[A-Za-z0-9]{6}$ ]]
          interrupted_private_cleanup="/run/refunddesk-internal-pki.${pki_generation_suffix}"
          sudo install -d -o root -g root -m 0700 "$interrupted_private_cleanup"
          sudo install -o root -g root -m 0600 \
            /etc/refunddesk/tls/postgres/ca.crt \
            "$interrupted_private_cleanup/postgres-ca.crt"

          pki_state_before="$(
            sudo stat --format='%n:%d:%i:%s:%Y' \
              /etc/refunddesk/tls/client/refunddesk-ca-bundle.crt \
              /etc/refunddesk/tls/postgres/ca.crt \
              /etc/refunddesk/tls/postgres/server.crt \
              /etc/refunddesk/tls/postgres/server.key \
              /etc/refunddesk/tls/verifier/ca.crt \
              /etc/refunddesk/tls/verifier/server.crt \
              /etc/refunddesk/tls/verifier/server.key
          )"
          sudo env \
            REFUNDDESK_TLS_ROOT=/etc/refunddesk/tls \
            bash deploy/lightsail/scripts/provision-internal-pki.sh
          sudo test ! -e "$interrupted_private_cleanup"
          pki_state_after="$(
            sudo stat --format='%n:%d:%i:%s:%Y' \
              /etc/refunddesk/tls/client/refunddesk-ca-bundle.crt \
              /etc/refunddesk/tls/postgres/ca.crt \
              /etc/refunddesk/tls/postgres/server.crt \
              /etc/refunddesk/tls/postgres/server.key \
              /etc/refunddesk/tls/verifier/ca.crt \
              /etc/refunddesk/tls/verifier/server.crt \
              /etc/refunddesk/tls/verifier/server.key
          )"
          test "$pki_state_after" = "$pki_state_before"
          sudo env \
            REFUNDDESK_TLS_ROOT=/etc/refunddesk/tls \
            bash deploy/lightsail/scripts/provision-internal-pki.sh
          pki_state_final="$(
            sudo stat --format='%n:%d:%i:%s:%Y' \
              /etc/refunddesk/tls/client/refunddesk-ca-bundle.crt \
              /etc/refunddesk/tls/postgres/ca.crt \
              /etc/refunddesk/tls/postgres/server.crt \
              /etc/refunddesk/tls/postgres/server.key \
              /etc/refunddesk/tls/verifier/ca.crt \
              /etc/refunddesk/tls/verifier/server.crt \
              /etc/refunddesk/tls/verifier/server.key
          )"
          test "$pki_state_final" = "$pki_state_before"

          for caddyfile in public verifier; do
            caddy_arguments=(
              --rm
              --network none
              --user 1000:1000
              --read-only
              --cap-drop ALL
              --cap-add NET_BIND_SERVICE
              --security-opt no-new-privileges
              --tmpfs /data:uid=1000,gid=1000,mode=0700
              --tmpfs /config:uid=1000,gid=1000,mode=0700
              --tmpfs /tmp:uid=1000,gid=1000,mode=1777
              --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/lightsail/Caddyfile.${caddyfile},target=/etc/caddy/Caddyfile,readonly"
            )
            if [[ "$caddyfile" = "public" ]]; then
              caddy_arguments+=(
                --env REFUNDDESK_PUBLIC_HOST=sandbox.example.invalid
                --env REFUNDDESK_ACME_EMAIL=operator@example.invalid
                --env REFUNDDESK_EDGE_ORIGIN_TOKEN=CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
              )
            else
              caddy_arguments+=(
                --mount type=bind,source=/etc/refunddesk/tls/verifier,target=/run/refunddesk/tls,readonly
              )
            fi
            sudo docker run "${caddy_arguments[@]}" \
              caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
              caddy validate --config /etc/caddy/Caddyfile
          done
          sudo install -o root -g root -m 0755 \
            deploy/lightsail/scripts/backup-launcher.sh \
            /usr/local/sbin/refunddesk-backup
          sudo install -o root -g root -m 0755 \
            deploy/lightsail/scripts/retention-launcher.sh \
            /usr/local/sbin/refunddesk-retention
          sudo install -o root -g root -m 0755 \
            deploy/lightsail/scripts/quiesce-recovery-launcher.sh \
            /usr/local/sbin/refunddesk-quiesce-recovery
          systemd-analyze verify \
            deploy/lightsail/systemd/refunddesk-backup.service \
            deploy/lightsail/systemd/refunddesk-backup.timer \
            deploy/lightsail/systemd/refunddesk-quiesce-recovery.service \
            deploy/lightsail/systemd/refunddesk-retention.service \
            deploy/lightsail/systemd/refunddesk-retention.timer

          sudo env \
            PATH="$PATH" \
            CI=true \
            GITHUB_ACTIONS=true \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            bash deploy/lightsail/scripts/test-postgres-root-mount-migration.sh

          sudo env \
            PATH="$PATH" \
            REFUNDDESK_ROOT="$GITHUB_WORKSPACE" \
            REFUNDDESK_CONFIG_ROOT=/etc/refunddesk \
            REFUNDDESK_COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/lightsail/compose.yml" \
            REFUNDDESK_COMPOSE_PROJECT=refunddesk-ci \
            REFUNDDESK_RELEASE_ENV=/etc/refunddesk/release.env \
            CI=true \
            GITHUB_ACTIONS=true \
            bash deploy/lightsail/scripts/test-database-owner-reservation.sh

          cleanup_lightsail_contract() {
            local status="$1"
            if [[ "$status" -ne 0 ]]; then
              sudo docker compose \
                --project-name refunddesk-ci \
                --env-file /etc/refunddesk/release.env \
                --file deploy/lightsail/compose.yml \
                logs --no-color postgres || true
            fi
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              down --remove-orphans >/dev/null 2>&1 || true
            exit "$status"
          }
          trap 'cleanup_lightsail_contract "$?"' EXIT

          sudo install -d -o root -g root -m 0700 /run/refunddesk-ci
          for bootstrap_pass in 1 2; do
            echo "PostgreSQL restricted-login bootstrap pass ${bootstrap_pass}/2"
            sudo env \
              PATH="$PATH" \
              REFUNDDESK_ROOT="$GITHUB_WORKSPACE" \
              REFUNDDESK_CONFIG_ROOT=/etc/refunddesk \
              REFUNDDESK_COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/lightsail/compose.yml" \
              REFUNDDESK_COMPOSE_PROJECT=refunddesk-ci \
              REFUNDDESK_RELEASE_ENV=/etc/refunddesk/release.env \
              REFUNDDESK_OPERATOR_LOCK=/run/refunddesk-ci/operator.lock \
              REFUNDDESK_IMAGE_TAG=sandbox-ci \
              REFUNDDESK_DATABASE_BOOTSTRAP_CONTRACT=ci-v2 \
              CI=true \
              GITHUB_ACTIONS=true \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              bash deploy/lightsail/scripts/bootstrap-database.sh
          done

          role_password_state() {
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              exec --no-TTY postgres \
              psql --username=refunddesk_owner --dbname=refunddesk \
                --no-psqlrc --tuples-only --no-align \
                --command="SELECT jsonb_object_agg(rolname, rolpassword ORDER BY rolname)::text FROM pg_authid WHERE rolname IN ('refunddesk_web_login','refunddesk_worker_login','refunddesk_queue_login','refunddesk_maintenance_login');"
          }
          role_password_state_before="$(role_password_state)"
          [[ -n "$role_password_state_before" ]]

          maintenance_secret_backup="$(mktemp)"
          sudo install -o root -g root -m 0600 \
            /etc/refunddesk/secrets/postgres-maintenance-password \
            "$maintenance_secret_backup"
          sudo install -o root -g root -m 0600 \
            /etc/refunddesk/secrets/postgres-owner-password \
            /etc/refunddesk/secrets/postgres-maintenance-password
          set +e
          sudo env \
            PATH="$PATH" \
            REFUNDDESK_ROOT="$GITHUB_WORKSPACE" \
            REFUNDDESK_CONFIG_ROOT=/etc/refunddesk \
            REFUNDDESK_COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/lightsail/compose.yml" \
            REFUNDDESK_COMPOSE_PROJECT=refunddesk-ci \
            REFUNDDESK_RELEASE_ENV=/etc/refunddesk/release.env \
            REFUNDDESK_OPERATOR_LOCK=/run/refunddesk-ci/operator.lock \
            REFUNDDESK_IMAGE_TAG=sandbox-ci \
            REFUNDDESK_DATABASE_BOOTSTRAP_CONTRACT=ci-v2 \
            CI=true \
            GITHUB_ACTIONS=true \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash deploy/lightsail/scripts/bootstrap-database.sh
          duplicate_password_status="$?"
          set -e
          sudo install -o root -g root -m 0600 \
            "$maintenance_secret_backup" \
            /etc/refunddesk/secrets/postgres-maintenance-password
          sudo rm -f -- "$maintenance_secret_backup"
          if [[ "$duplicate_password_status" -ne 3 ]]; then
            echo "duplicate-password bootstrap returned an unexpected status" >&2
            exit 1
          fi
          role_password_state_after="$(role_password_state)"
          if [[ "$role_password_state_after" != "$role_password_state_before" ]]; then
            echo "duplicate-password bootstrap mutated restricted role credentials" >&2
            exit 1
          fi
          unset role_password_state_before role_password_state_after

          role_count="$(
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              exec --no-TTY postgres \
              psql --username=refunddesk_owner --dbname=refunddesk \
                --tuples-only --no-align \
                --command="SELECT count(*) FROM pg_roles WHERE rolname IN ('refunddesk_web_login','refunddesk_worker_login','refunddesk_queue_login','refunddesk_maintenance_login') AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND rolinherit AND NOT rolreplication AND NOT rolbypassrls;"
          )"
          test "$role_count" = "4"
          maintenance_membership="$(
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              exec --no-TTY postgres \
              psql --username=refunddesk_owner --dbname=refunddesk \
                --tuples-only --no-align \
                --command="SELECT array_agg(parent.rolname ORDER BY parent.rolname) = ARRAY['refunddesk_maintenance']::name[] FROM pg_auth_members AS membership INNER JOIN pg_roles AS parent ON parent.oid = membership.roleid INNER JOIN pg_roles AS member ON member.oid = membership.member WHERE member.rolname = 'refunddesk_maintenance_login';"
          )"
          test "$maintenance_membership" = "t"
          trap - EXIT
      - name: Build provider-neutral OCI targets
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build --target web --tag refunddesk-web:ci .
          docker build --target worker --tag refunddesk-worker:ci .
          docker build --target migrate --tag refunddesk-migrate:ci .
      - name: Run isolated retention one-shot on PostgreSQL 18
        run: |
          set -euo pipefail
          cleanup_retention_contract() {
            status="$?"
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              sudo docker compose \
                --project-name refunddesk-ci \
                --env-file /etc/refunddesk/release.env \
                --file deploy/lightsail/compose.yml \
                logs --no-color postgres || true
            fi
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              down --remove-orphans >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup_retention_contract EXIT

          docker tag refunddesk-migrate:ci refunddesk-migrate:sandbox-ci
          sudo bash -c '
            set -euo pipefail
            owner_password="$(</etc/refunddesk/secrets/postgres-owner-password)"
            web_password="$(</etc/refunddesk/secrets/postgres-web-password)"
            worker_password="$(</etc/refunddesk/secrets/postgres-worker-password)"
            queue_password="$(</etc/refunddesk/secrets/postgres-queue-password)"
            maintenance_password="$(</etc/refunddesk/secrets/postgres-maintenance-password)"
            pseudonym_key="$(openssl rand -base64 32 | tr -d "\n")"
            printf "%s\n" \
              "NODE_ENV=production" \
              "LOG_LEVEL=info" \
              "DATABASE_URL=postgresql://refunddesk_web_login:${web_password}@postgres.refunddesk.internal:5432/refunddesk?sslmode=verify-full" \
              "WORKER_DATABASE_URL=postgresql://refunddesk_worker_login:${worker_password}@postgres.refunddesk.internal:5432/refunddesk?sslmode=verify-full" \
              "PGBOSS_DATABASE_URL=postgresql://refunddesk_queue_login:${queue_password}@postgres.refunddesk.internal:5432/refunddesk?sslmode=verify-full" \
              "DATABASE_MIGRATION_URL=postgresql://refunddesk_owner:${owner_password}@postgres.refunddesk.internal:5432/refunddesk?sslmode=verify-full" \
              > /etc/refunddesk/migration.env
            printf "%s\n" \
              "NODE_ENV=production" \
              "REFUNDDESK_MAINTENANCE_DATABASE_URL=postgresql://refunddesk_maintenance_login:${maintenance_password}@postgres.refunddesk.internal:5432/refunddesk?sslmode=verify-full" \
              "REFUNDDESK_PURGE_PSEUDONYM_HMAC_KEY_V1=${pseudonym_key}" \
              "REFUNDDESK_RETENTION_BATCH_SIZE=25" \
              "REFUNDDESK_RETENTION_SCOPE=test_sandbox" \
              > /etc/refunddesk/maintenance.env
            chown root:root /etc/refunddesk/migration.env /etc/refunddesk/maintenance.env
            chmod 0600 /etc/refunddesk/migration.env /etc/refunddesk/maintenance.env
          '

          for migration_pass in 1 2; do
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              --profile release run --rm --no-deps --pull never migrate
          done

          retention_result="$(
            sudo docker compose \
              --project-name refunddesk-ci \
              --env-file /etc/refunddesk/release.env \
              --file deploy/lightsail/compose.yml \
              --profile maintenance run --rm --no-deps --pull never maintenance
          )"
          jq --exit-status '
            .component == "retention-purge"
            and .status == "completed"
            and .selected == 0
            and .purged == 0
            and .blocked_after_selection == 0
          ' <<<"$retention_result" >/dev/null

          sudo bash -c \
            'printf "%s\n" "STRIPE_PLATFORM_TEST_EFFECT_KEY=forbidden" >> /etc/refunddesk/maintenance.env'
          if sudo docker compose \
            --project-name refunddesk-ci \
            --env-file /etc/refunddesk/release.env \
            --file deploy/lightsail/compose.yml \
            --profile maintenance run --rm --no-deps --pull never maintenance; then
            echo "maintenance accepted foreign Stripe authority" >&2
            exit 1
          fi
      - name: Inspect OCI security contracts
        run: |
          set -euo pipefail
          for image in refunddesk-web:ci refunddesk-worker:ci refunddesk-migrate:ci; do
            test "$(docker inspect --format '{{.Config.User}}' "$image")" = "node"
          done
          docker run --rm --entrypoint node refunddesk-migrate:ci -e "
            const fs = require('node:fs');
            const forbidden = [
              '/workspace/apps/platform',
              '/workspace/apps/stripe-app',
              '/workspace/docs',
              '/workspace/docker',
              '/workspace/packages/db/test'
            ];
            if (forbidden.some((path) => fs.existsSync(path))) process.exit(1);
            if (!fs.existsSync('/workspace/packages/config/dist/check-release.js')) process.exit(1);
            if (!fs.existsSync('/workspace/packages/config/dist/check-key-rotation-transition.js')) process.exit(1);
          "
          docker run --rm --entrypoint node refunddesk-worker:ci -e "
            const fs = require('node:fs');
            if (
              fs.existsSync('/app/node_modules/.bin/prisma') ||
              fs.existsSync('/app/node_modules/prisma')
            ) process.exit(1);
          "
          test "$(
            docker run --rm --network none --entrypoint pnpm \
              refunddesk-migrate:ci --version
          )" = "11.17.0"
      - name: Smoke scoped OCI runtimes
        env:
          APP_BASE_URL: https://sandbox.refunddesk.invalid
          REFUNDDESK_GLOBAL_LIVE_ENABLED: "false"
          STRIPE_API_VERSION: 2026-06-24.dahlia
          STRIPE_APP_ID: ca_ciSynthetic
          STRIPE_APP_SIGNING_SECRET: absec_ci_synthetic
          STRIPE_PLATFORM_TEST_ACCOUNT_ID: acct_CiPlatform123
          STRIPE_MANAGED_SANDBOX_ACCOUNT_ID: acct_CiSandbox456
          STRIPE_PLATFORM_TEST_READ_KEY: rk_test_ci_platform_read
          STRIPE_MANAGED_SANDBOX_READ_KEY: rk_test_ci_sandbox_read
          STRIPE_PLATFORM_TEST_EFFECT_KEY: rk_test_ci_platform_effect
          STRIPE_MANAGED_SANDBOX_EFFECT_KEY: rk_test_ci_sandbox_effect
          STRIPE_ACCOUNT_TEST_WEBHOOK_SECRET: whsec_ci_test
          STRIPE_ACCOUNT_SANDBOX_WEBHOOK_SECRET: whsec_ci_sandbox
          STRIPE_ACCOUNT_LIVE_WEBHOOK_SECRET: disabled
          REFUNDDESK_FIELD_ENCRYPTION_KEY_V2: BgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgY=
          REFUNDDESK_ACTIVE_FIELD_KEY_VERSION: v2
          REFUNDDESK_FIELD_KEY_ROTATION_STATE: active
          REFUNDDESK_PROOF_HMAC_KEY_V2: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          REFUNDDESK_ACTIVE_PROOF_KEY_VERSION: v2
          REFUNDDESK_PROOF_KEY_ROTATION_STATE: active
          REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V1: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
          REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V2: CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg=
          REFUNDDESK_ACTIVE_APPROVAL_ATTESTATION_KEY_VERSION: v2
          REFUNDDESK_APPROVAL_ATTESTATION_KEY_ROTATION_STATE: active
          REFUNDDESK_SIGNED_REQUEST_VERIFIER_TOKEN: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
          REFUNDDESK_SIGNED_REQUEST_VERIFIER_URL: https://worker.refunddesk.invalid/internal/v1/signed-requests/verify
        run: |
          set -euo pipefail
          cleanup() {
            docker stop --time 40 refunddesk-worker-ci refunddesk-web-ci >/dev/null 2>&1 || true
            docker rm refunddesk-worker-ci refunddesk-web-ci >/dev/null 2>&1 || true
          }
          finish() {
            exit_code="$?"
            trap - EXIT
            if [[ "$exit_code" -ne 0 ]]; then
              for container in refunddesk-web-ci refunddesk-worker-ci; do
                if docker inspect "$container" >/dev/null 2>&1; then
                  docker inspect \
                    --format 'container={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{json .State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    "$container" || true
                  docker logs --tail 200 "$container" 2>&1 || true
                fi
              done
            fi
            cleanup
            exit "$exit_code"
          }
          trap finish EXIT

          docker run --rm --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            -e DATABASE_URL \
            -e WORKER_DATABASE_URL \
            -e DATABASE_MIGRATION_URL \
            -e PGBOSS_DATABASE_URL \
            refunddesk-migrate:ci

          docker run -d --network host --name refunddesk-web-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 10 \
            -e NODE_ENV=production \
            -e LOG_LEVEL=error \
            -e PORT=3200 \
            -e APP_BASE_URL \
            -e DATABASE_URL \
            -e STRIPE_API_VERSION \
            -e STRIPE_APP_ID \
            -e STRIPE_PLATFORM_TEST_ACCOUNT_ID \
            -e STRIPE_MANAGED_SANDBOX_ACCOUNT_ID \
            -e STRIPE_PLATFORM_TEST_READ_KEY \
            -e STRIPE_MANAGED_SANDBOX_READ_KEY \
            -e STRIPE_ACCOUNT_TEST_WEBHOOK_SECRET \
            -e STRIPE_ACCOUNT_SANDBOX_WEBHOOK_SECRET \
            -e STRIPE_ACCOUNT_LIVE_WEBHOOK_SECRET \
            -e REFUNDDESK_GLOBAL_LIVE_ENABLED \
            -e REFUNDDESK_FIELD_ENCRYPTION_KEY_V1 \
            -e REFUNDDESK_FIELD_ENCRYPTION_KEY_V2 \
            -e REFUNDDESK_EXPORT_SIGNING_KEY_V1 \
            -e REFUNDDESK_ACTIVE_FIELD_KEY_VERSION \
            -e REFUNDDESK_FIELD_KEY_ROTATION_STATE \
            -e REFUNDDESK_SIGNED_REQUEST_VERIFIER_TOKEN \
            -e REFUNDDESK_SIGNED_REQUEST_VERIFIER_URL \
            refunddesk-web:ci

          docker run -d --network host --name refunddesk-worker-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 10 \
            -e NODE_ENV=production \
            -e LOG_LEVEL=error \
            -e WORKER_DATABASE_URL \
            -e PGBOSS_DATABASE_URL \
            -e STRIPE_API_VERSION \
            -e STRIPE_APP_SIGNING_SECRET \
            -e STRIPE_PLATFORM_TEST_ACCOUNT_ID \
            -e STRIPE_MANAGED_SANDBOX_ACCOUNT_ID \
            -e STRIPE_PLATFORM_TEST_EFFECT_KEY \
            -e STRIPE_MANAGED_SANDBOX_EFFECT_KEY \
            -e REFUNDDESK_GLOBAL_LIVE_ENABLED \
            -e REFUNDDESK_PROOF_HMAC_KEY_V1 \
            -e REFUNDDESK_PROOF_HMAC_KEY_V2 \
            -e REFUNDDESK_ACTIVE_PROOF_KEY_VERSION \
            -e REFUNDDESK_PROOF_KEY_ROTATION_STATE \
            -e REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V1 \
            -e REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V2 \
            -e REFUNDDESK_ACTIVE_APPROVAL_ATTESTATION_KEY_VERSION \
            -e REFUNDDESK_APPROVAL_ATTESTATION_KEY_ROTATION_STATE \
            -e REFUNDDESK_SIGNED_REQUEST_VERIFIER_TOKEN \
            -e WORKER_HEALTH_HOST=0.0.0.0 \
            -e WORKER_HEALTH_PORT=3201 \
            refunddesk-worker:ci

          wait_for_endpoint() {
            name="$1"
            container="$2"
            url="$3"
            for attempt in $(seq 1 80); do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [[ "$status" = "200" ]]; then
                return 0
              fi
              if [[ "$attempt" -eq 80 ]]; then
                echo "endpoint=${name} host_status=${status}"
                docker exec "$container" node -e "
                  fetch('${url}')
                    .then((response) => console.error('endpoint=${name} container_status=' + response.status))
                    .catch(() => console.error('endpoint=${name} container_status=unreachable'));
                " || true
                return 1
              fi
              sleep 0.25
            done
          }
          wait_for_endpoint web-ready refunddesk-web-ci http://127.0.0.1:3200/api/ready
          wait_for_endpoint worker-ready refunddesk-worker-ci http://127.0.0.1:3201/ready
          docker exec refunddesk-web-ci node -e "
            const forbidden = [
              'STRIPE_APP_SIGNING_SECRET',
              'STRIPE_PLATFORM_TEST_EFFECT_KEY',
              'STRIPE_MANAGED_SANDBOX_EFFECT_KEY',
              'REFUNDDESK_PROOF_HMAC_KEY_V1',
              'REFUNDDESK_PROOF_HMAC_KEY_V2',
              'REFUNDDESK_PROOF_KEY_ROTATION_STATE',
              'REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V1',
              'REFUNDDESK_APPROVAL_ATTESTATION_HMAC_KEY_V2',
              'REFUNDDESK_APPROVAL_ATTESTATION_KEY_ROTATION_STATE',
              'WORKER_DATABASE_URL',
              'PGBOSS_DATABASE_URL',
              'DATABASE_MIGRATION_URL'
            ];
            if (forbidden.some((name) => process.env[name] !== undefined)) process.exit(1);
            if (
              process.env.REFUNDDESK_ACTIVE_FIELD_KEY_VERSION !== 'v2' ||
              process.env.REFUNDDESK_FIELD_KEY_ROTATION_STATE !== 'active'
            ) process.exit(1);
          "
          docker exec refunddesk-worker-ci node -e "
            const forbidden = [
              'STRIPE_PLATFORM_TEST_READ_KEY',
              'STRIPE_MANAGED_SANDBOX_READ_KEY',
              'STRIPE_ACCOUNT_TEST_WEBHOOK_SECRET',
              'STRIPE_ACCOUNT_SANDBOX_WEBHOOK_SECRET',
              'REFUNDDESK_FIELD_ENCRYPTION_KEY_V1',
              'REFUNDDESK_FIELD_ENCRYPTION_KEY_V2',
              'REFUNDDESK_FIELD_KEY_ROTATION_STATE',
              'REFUNDDESK_EXPORT_SIGNING_KEY_V1',
              'DATABASE_URL',
              'DATABASE_MIGRATION_URL'
            ];
            if (forbidden.some((name) => process.env[name] !== undefined)) process.exit(1);
            if (
              process.env.REFUNDDESK_ACTIVE_PROOF_KEY_VERSION !== 'v2' ||
              process.env.REFUNDDESK_PROOF_KEY_ROTATION_STATE !== 'active' ||
              process.env.REFUNDDESK_ACTIVE_APPROVAL_ATTESTATION_KEY_VERSION !== 'v2' ||
              process.env.REFUNDDESK_APPROVAL_ATTESTATION_KEY_ROTATION_STATE !== 'active'
            ) process.exit(1);
          "
          curl --fail --silent http://127.0.0.1:3200/ >/dev/null
          test "$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --header 'X-RefundDesk-Edge-Verified: cloudfront-v1' \
                --header 'X-RefundDesk-Viewer-Chain: 198.51.100.10' \
                --data '{}' \
                http://127.0.0.1:3200/api/v1/context/sync
          )" = "401"
          for environment in test sandbox; do
            test "$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --header 'X-RefundDesk-Edge-Verified: cloudfront-v1' \
                --header 'X-RefundDesk-Viewer-Chain: 3.18.12.63' \
                --data '{}' \
                "http://127.0.0.1:3200/api/webhooks/stripe-account/${environment}"
            )" = "400"
            test "$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{}' \
                "http://127.0.0.1:3200/api/webhooks/stripe-connected/${environment}"
            )" = "404"
          done
          test "$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              http://127.0.0.1:3200/api/webhooks/stripe-account/live
          )" = "503"
          for authority_action in verify attest; do
            test "$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{}' \
                "http://127.0.0.1:3201/internal/v1/signed-requests/${authority_action}"
            )" = "403"
          done

          for container in refunddesk-web-ci refunddesk-worker-ci; do
            for attempt in $(seq 1 40); do
              test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy" && break
              test "$attempt" -lt 40
              sleep 0.25
            done
          done

          started_at="$(date +%s)"
          docker stop --time 40 refunddesk-worker-ci >/dev/null
          stopped_at="$(date +%s)"
          test "$((stopped_at - started_at))" -lt 40
          test "$(docker inspect --format '{{.State.ExitCode}}' refunddesk-worker-ci)" = "0"
          docker stop --time 40 refunddesk-web-ci >/dev/null
      - name: Verify standalone Stripe App package
        working-directory: apps/stripe-app
        run: |
          corepack pnpm@10.30.3 install --frozen-lockfile --ignore-workspace --ignore-scripts
          corepack pnpm@10.30.3 --ignore-workspace run lint
          corepack pnpm@10.30.3 --ignore-workspace run build
          corepack pnpm@10.30.3 --ignore-workspace run test
          corepack pnpm@10.30.3 --ignore-workspace audit --prod --audit-level high

  postflight-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the exact Windows event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the exact Windows event revision
        shell: powershell
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD) -cne $env:EXPECTED_REVISION) {
            throw "The checkout does not match github.sha."
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Validate Windows postflight transport contracts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node --test scripts/validate-lightsail-postflight.test.mjs
          node --test scripts/validate-lightsail-containment-reconciliation.test.mjs
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/invoke-lightsail-postflight.contract.Tests.ps1
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/invoke-lightsail-containment-reconciliation.contract.Tests.ps1

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: refunddesk
      POSTGRES_USER: refunddesk_owner
      POSTGRES_PASSWORD: refunddesk_owner_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunddesk_owner -d refunddesk"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - refunddesk-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  refunddesk-postgres:
